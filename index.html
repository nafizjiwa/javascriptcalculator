<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
    <!--START CALCULATOR  -->
    <div class="calculator">
      <!-- START DISPLAY CALCULATION  -->
      <input type="text" id="inputBox" placeholder="0" readonly>
      <!--END DISPLAY CALCULATION  -->
    <!--START BUTTONS CALCULATOR -->
          <div>
              <button class="operator ac">AC</button>
              <button class="operator del">DEL</button>
              <button class="operator">%</button>
              <button class="operator">/</button>
          </div>
          <div>
              <button>7</button>
              <button>8</button>
              <button>9</button>
              <button class='operator'>*</button>
          </div>
          <div>
              <button>4</button>
              <button>5</button>
              <button>6</button>
              <button class="operator">-</button>
          </div>
           <div>
              <button>1</button>
              <button>2</button>
              <button>3</button>
              <button class='operator'>+</button>
          </div>
          <div>
              <button>00</button>
              <button>0</button>
              <button>.</button>
              <button class='equalBtn'>=</button>
          </div>
    <!--END CALCULATOR BUTTONS  -->
    </div>
    <!--END CALCULATOR -->
    <script src="./script.js"></script>
  </body>
</html>
